name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  orchestrator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/orchestrator
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  workers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@v7

      - name: Install libvips and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvips-dev ffmpeg pkg-config

      - uses: actions/setup-go@v7
        with:
          go-version-file: workers/go.mod

      - name: Vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@v9
        with:
          working-directory: workers

      - name: Test
        run: go test ./...
